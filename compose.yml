services:
  storage:
    build: .
    image: vigo/storage:local
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "${STORAGE_BIND_ADDRESS:-127.0.0.1}:8082:8082"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/vigo_storage_service}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?Required database username}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Required database password}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      AUTH_JWKS_URI: ${AUTH_JWKS_URI:?Required Auth JWKS URI}
      JWT_ISSUER: ${JWT_ISSUER:?Required JWT issuer}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?Required JWT audience}
      STORAGE_USER_BASE_URL: ${STORAGE_USER_BASE_URL:?Required User REST origin}
      STORAGE_USER_ALLOW_HTTP: ${STORAGE_USER_ALLOW_HTTP:-false}
      # Object storage backend: filesystem (default) or s3 for ParsPack-style storage.
      # Compose only forwards variables listed here, so an S3 setting in .env has no
      # effect until it also appears in this list.
      STORAGE_BACKEND: ${STORAGE_BACKEND:-filesystem}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
      # Credentials come from .env only; never put keys in this file or .env.example.
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:-}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:-}
      STORAGE_S3_PATH_STYLE: ${STORAGE_S3_PATH_STYLE:-true}
      STORAGE_PRESIGN_TTL: ${STORAGE_PRESIGN_TTL:-PT10M}
      # Local scratch space for staged uploads. Required even with the s3 backend,
      # because files are validated on disk before they are written to the bucket.
      STORAGE_FS_ROOT: /var/lib/vigo/storage
      MANAGEMENT_ADDRESS: 0.0.0.0
    volumes:
      - storage_data:/var/lib/vigo/storage
    networks: [vigo-app]
    labels:
      logging: "true"
networks:
  vigo-app:
    external: true
    name: ${APP_NETWORK_NAME:-vigo-app}
volumes:
  storage_data:
    name: ${STORAGE_VOLUME_NAME:-vigo-storage-data}
